[package]
name = "rasur"
version.workspace = true
edition.workspace = true
publish = false

autotests = false

[lib]
path = "src/lib/lib.rs"

[dependencies]
# NOTE: The underlying Unicode version of Rust & of this crate is 17. Once the Rust language
# upgrades Unicode 18, consider using `std`'s `is_xid_{start,continue}` instead.
# Feature: `char_is_xid`. Tracking issue: <https://github.com/rust-lang/rust/issues/164841>.
unicode-ident = "=1.0.22"
utility = { path = "etc/lib/utility" }

[workspace]
members = ["etc/lib/utility","src/cli"]
default-members = ["src/cli"]

[workspace.package]
version = "0.0.0-pre-alpha"
edition = "2024"
