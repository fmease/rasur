[package]
name = "rasur"
version.workspace = true
edition.workspace = true
publish = false

autotests = false

[lib]
path = "src/lib/lib.rs"

[dependencies]
utility = { path = "src/utility" }

[workspace]
members = ["src/*"]
exclude = ["src/lib"]
default-members = ["src/cli"]

[workspace.package]
version = "0.0.0-pre-alpha"
edition = "2024"
